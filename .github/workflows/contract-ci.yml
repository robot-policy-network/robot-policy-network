name: Contract CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge install OpenZeppelin/openzeppelin-contracts@v5.0.2 --no-git
      - run: forge install foundry-rs/forge-std --no-git
      - run: forge build
      - run: forge test -vvv

      # Proves the canonicalizer (the only implementation of spec §3) matches
      # its pinned vectors. If this drifts, every protocol hash is suspect.
      - name: Canonical serialization vectors
        run: node references/canonical.test.mjs
      - name: Format check (settlement subsystem)
        run: forge fmt --check contracts/EvaluationEscrow.sol test/EvaluationEscrow.t.sol script/DeployEvaluationEscrow.s.sol

      # Proves the deploy path works and that its safety guards actually fire.
      # Without this, "the contract is deployable" would be an untested claim.
      - name: Deploy script smoke test (anvil)
        run: |
          set -euo pipefail
          anvil --silent &
          ANVIL_PID=$!
          trap 'kill $ANVIL_PID' EXIT
          for i in $(seq 1 30); do
            curl -sf -X POST -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
              http://127.0.0.1:8545 >/dev/null && break
            sleep 1
          done

          export DEPLOYER_PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
          export USDC_ADDRESS=0x3600000000000000000000000000000000000000
          export ALLOW_USDC_WITHOUT_CODE=1

          # 1. A valid deployment must succeed.
          EVALUATOR_ADDRESS=0x70997970C51812dc3A010C7d01b50e0d17dc79C8 \
            forge script script/DeployEvaluationEscrow.s.sol \
              --rpc-url http://127.0.0.1:8545 --broadcast

          ADDR=$(jq -r '.transactions[] | select(.contractName=="EvaluationEscrow") | .contractAddress' \
            broadcast/DeployEvaluationEscrow.s.sol/31337/run-latest.json)
          test -n "$ADDR"

          # 2. Deployed state must match the constructor arguments.
          test "$(cast call "$ADDR" 'evaluator()(address)' --rpc-url http://127.0.0.1:8545)" = \
               "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
          test "$(cast call "$ADDR" 'usdc()(address)' --rpc-url http://127.0.0.1:8545)" = \
               "0x3600000000000000000000000000000000000000"
          test "$(cast call "$ADDR" 'nextJobId()(uint256)' --rpc-url http://127.0.0.1:8545)" = "1"

          # 3. The guard must reject evaluator == owner.
          if EVALUATOR_ADDRESS=0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266 \
               forge script script/DeployEvaluationEscrow.s.sol \
                 --rpc-url http://127.0.0.1:8545 > /tmp/guard.log 2>&1; then
            echo "FAIL: deploy script allowed evaluator == owner"; exit 1
          fi
          grep -q "evaluator must differ from owner" /tmp/guard.log
          echo "deploy script smoke test passed"
