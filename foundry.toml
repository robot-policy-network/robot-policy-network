[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
optimizer = true
optimizer_runs = 200
solc_version = "0.8.24"
# The end-to-end settlement script exceeds the legacy codegen stack limit.
# via-ir is the compiler's own recommended fix and is standard for production
# Solidity. It applies to the whole project, so tests and scripts compile the
# same way locally and in CI.
via_ir = true

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[rpc_endpoints]
arc = "https://rpc.mainnet.arc.io"
